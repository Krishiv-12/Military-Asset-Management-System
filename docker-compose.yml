services:
  db:
    image: postgres:16-alpine
    container_name: mams-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mams
      POSTGRES_PASSWORD: mams
      POSTGRES_DB: mams
    ports:
      - "5432:5432"
    volumes:
      - mams_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mams -d mams"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mams_pgdata:
